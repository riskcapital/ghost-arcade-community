appId: live.ghostarcade.community
productName: "Ghost Arcade Community"
executableName: "ghost-arcade-community"
copyright: "Copyright (c) 2024-2026 Ghost Arcade contributors. AGPL-3.0-or-later."
artifactName: "ghost-arcade-community-${version}-${arch}.${ext}"

directories:
  output: dist-electron
  buildResources: build-resources

files:
  - dist/**/*
  - electron/**/*
  - server/**/*
  - package.json
  # Window icon needs to be inside the asar-readable tree at runtime.
  # main.js loads it via path.join(__dirname, '..', 'build-resources', ...).
  - build-resources/icons/icon.png

# Bundled shaders only — Pro-only CuratedISF / user-shaders dirs are absent
# in the OSS source tree.
extraResources:
  - from: ISF/
    to: ISF/
    filter:
      - "**/*"

# ─── File Associations ─────────────────────────────────────────────────────
fileAssociations:
  - ext: gha
    name: "Ghost Arcade Project"
    description: "Ghost Arcade Project File"
    role: Editor

# ─── Windows ───────────────────────────────────────────────────────────────
# OSS skips code signing entirely — community builds don't have access to
# the Pro signing cert. Users will see Windows SmartScreen on first launch
# until enough installs accumulate (or the user adds an exception). Forks
# can override `win.publisherName` + add `win.certificateFile` here.
win:
  target: nsis
  icon: build-resources/icons/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build-resources/icons/icon.ico
  uninstallerIcon: build-resources/icons/icon.ico
  installerSidebar: brand-assets/installer-splash.bmp
  uninstallerSidebar: brand-assets/installer-splash.bmp
  shortcutName: "Ghost Arcade Community"
  artifactName: "ghost-arcade-community-Setup-${version}.${ext}"

# ─── macOS ─────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build-resources/icons/icon.icns
  category: public.app-category.video
  hardenedRuntime: true
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  # Risk Capital Media LLC's Developer ID Application cert (the same one
  # Pro uses) signs and notarizes Community DMGs too. Without this users
  # got "Apple cannot verify this app is free of malware" on first launch
  # with no "Open Anyway" path on recent macOS — only Quit / Move to Trash.
  # Required env vars (set as Actions secrets on the Community repo):
  #   CSC_LINK                       — base64 of the .p12 cert
  #   CSC_KEY_PASSWORD               — .p12 password
  #   APPLE_ID                       — apple developer account email
  #   APPLE_APP_SPECIFIC_PASSWORD    — app-specific password from appleid.apple.com
  #   APPLE_TEAM_ID                  — team id from developer.apple.com
  notarize: true
  gatekeeperAssess: false

dmg:
  iconSize: 128
  # DMG window contents — both the Applications symlink AND the .app bundle
  # entry are required, even though `type: file` doesn't carry a path
  # (electron-builder picks up the freshly-built .app by convention). The
  # earlier comment claiming auto-placement worked when the `file` entry
  # was omitted was wrong: v1.1.0 (CI run 25531529086) shipped 944 KB DMGs
  # that contained ONLY the /Applications symlink and no actual app
  # bundle. Adding the file entry back, mirroring Pro's working config.
  contents:
    - x: 380
      y: 170
      type: link
      path: /Applications
    - x: 130
      y: 170
      type: file

# ─── Linux ─────────────────────────────────────────────────────────────────
# AppImage is the most portable target. Forks can add deb / rpm here.
linux:
  target:
    - AppImage
  category: AudioVideo
  icon: build-resources/icons/icon.png

# ─── Publish ────────────────────────────────────────────────────────────────
# Intentionally NO `publish:` block here. CI (.github/workflows/build.yml)
# runs `electron-builder --publish never` and then uses
# `softprops/action-gh-release` to upload artifacts to this repo's
# Releases page. Adding a `publish:` block would either be ignored
# (because of --publish never) or, on a local `--publish always`,
# create a confusing parallel upload path. Release flow: push a `v*`
# git tag → CI builds + (Mac-)signs + uploads.
