name: Bug report
description: Report a defect in Ghost Arcade Community
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        For Pro-edition issues (Spout/Syphon, AI generation, dual-deck VJ,
        macros/snapshots/setlists, plugin system), this is the wrong tracker —
        please contact ghostarcade.live support.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps so we can reproduce locally.
      placeholder: |
        1. Launch the app
        2. Open Settings → MIDI
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Ghost Arcade Community version
      description: From Settings → About, or the title bar.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Linux (Ubuntu / Debian)
        - Linux (Arch / Manjaro)
        - Linux (other)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste the debug log if you have one.
        Location: `%LOCALAPPDATA%\ghost-arcade-community-debug.log` (Windows)
        or `~/Library/Logs/ghost-arcade-community-debug.log` (macOS).
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: This is a bug in Ghost Arcade Community (not a feature request, not a Pro-edition issue)
          required: true
