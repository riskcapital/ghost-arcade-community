name: Build & Release

# Open-source build pipeline for Ghost Arcade Community.
# PRs and branch pushes run quality gates. Tag pushes build unsigned
# installers for Windows / macOS / Linux.
# Forks that want to ship signed builds should add their own signing keys
# to the repo secrets and update the platform-specific build steps below.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.1)'
        required: false

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Svelte and TypeScript check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Electron (Windows NSIS, unsigned)
        # --publish never: this repo IS the release host (no cross-repo
        # split like Pro), but the upload to GitHub Releases is handled
        # by softprops/action-gh-release below. Preventing electron-builder
        # from also auto-publishing avoids the two-uploader race that
        # caused 502 Bad Gateway loops on Pro v0.5.5 macOS.
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.exe

  build-macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # macOS dual-arch DMG (x64 + arm64), signed with Risk Capital Media
      # LLC's Developer ID Application cert + Apple notarization. Without
      # this, Gatekeeper on recent macOS shows users "Apple cannot verify
      # this app is free of malware" on first launch with NO "Open Anyway"
      # escape hatch — only Quit / Move to Trash. Notarization adds ~3-5
      # min to the build but is the only path that works for unauthenticated
      # downloads from the GitHub release.
      #
      # `mac.target` in electron-builder.yml declares both arches, BUT on
      # macos-latest (Apple Silicon runner) the CLI defaults to host-arch
      # only unless --x64 --arm64 are passed explicitly. Without those
      # flags the v1.0.0 build only produced arm64 — Intel users were stuck.
      - name: Build Electron (macOS DMG, signed + notarized, dual-arch)
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.dmg

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Electron (Linux AppImage)
        run: npx electron-builder --linux AppImage --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.AppImage
